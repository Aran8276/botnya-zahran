# laravel 9080
# bot-server 9090
# frontend-web 9100
# landing-page 9200

services:
  bot-server:
    build: ./bot-server
    ports:
      - "9090:4000"
  frontend-web:
    build: ./frontend-web
    ports:
      - "9100:3000"
  landing-page:
    build: ./landing-page
    ports:
      - "9200:3000"
  fpm:
    build: ./backend-api
    volumes:
      - ./backend-api/src:/var/www
    networks:
      - laravel_app
  nginx:
    image: nginx:stable-alpine
    ports:
      - 9080:80
    volumes:
      - ./backend-api/src:/var/www
      - ./backend-api/nginx:/etc/nginx/conf.d
    networks:
      - laravel_app
  db:
    image: mysql:8.4.0
    volumes:
      - mysql-volume:/var/lib/mysql
    environment:
      MYSQL_USER: "laravel"
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: "laravel"
      MYSQL_DATABASE: "laravel"
    networks:
      - laravel_app
networks:
  laravel_app:
volumes:
  mysql-volume:
